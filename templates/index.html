<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Paper Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* Isolation */
#app, #app * {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}
#app *::before, #app *::after {
  content: none !important;
  display: none !important;
}

/* Background */
body {
  margin: 0;
  background: #020617;
  color: #e5e7eb;
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 20px;
}

/* Container */
#app {
  width: 100%;
  max-width: 900px;
}
.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(16px);
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}

/* Top */
.top {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  opacity: .7;
  margin-bottom: 18px;
}
.upload {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 20px;
  border: none;
  background: transparent;
  cursor: pointer;
  transition: 0.2s ease;
}

/* ICON */
.upload .icon {
  font-size: 34px;
  margin-bottom: 8px;
  transition: 0.2s ease;
}

/* TEXT */
.upload .title {
  font-weight: 500;
  transition: 0.2s ease;
}

.upload .sub {
  font-size: 12px;
  opacity: 0.6;
}

/* 🔥 HOVER ONLY ON CONTENT */
.upload:hover .icon {
  transform: scale(1.1);
  filter: drop-shadow(0 0 10px rgba(56,189,248,0.6));
}

.upload:hover .title {
  color: #38bdf8;
}

/* REMOVE FILE INPUT */
.upload input {
  display: none;
}

/* File chip */
.file-chip {
  margin-top: 10px;
  display: inline-block;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(56,189,248,0.2);
  font-size: 12px;
}

/* Sections */
.section {
  margin-top: 18px;
}

.label {
  font-size: 12px;
  opacity: .7;
  margin-bottom: 8px;
}

/* Options */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.opt {
  padding: 12px;
  border-radius: 12px;
  text-align: center;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  cursor: pointer;
  transition: .2s;
}

.opt:hover {
  background: rgba(56,189,248,0.2);
}

input[type="radio"] {
  display: none;
}

input[type="radio"]:checked + .opt {
  background: linear-gradient(135deg,#38bdf8,#6366f1);
  border: none;
}

/* Button */
.btn {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  color: #fff;
  background: linear-gradient(135deg,#6366f1,#38bdf8);
}

/* Mobile */
@media (max-width: 600px) {
  .grid {
    grid-template-columns: 1fr;
  }
}

</style>
</head>

<body>

<div id="app">
  <div class="card">

    <div class="top">
      <span>Question Paper Builder</span>
      <span>Smart Generation</span>
    </div>

    <form method="POST" enctype="multipart/form-data">

      <!-- Upload -->
      <label class="upload" id="uploadBox">
        <div class="icon">📂</div>
        <div class="title">Upload syllabus</div>
        <div class="sub">Click or drag file</div>
        <div id="fileChip"></div>
        <input type="file" name="file" id="fileInput" required>
      </label>

      <!-- Type -->
      <div class="section">
        <div class="label">Question Type</div>
        <div class="grid">
          <label><input type="radio" name="type" value="mcq" required><div class="opt">MCQ</div></label>
          <label><input type="radio" name="type" value="descriptive"><div class="opt">Descriptive</div></label>
          <label><input type="radio" name="type" value="oneliner"><div class="opt">One-liner</div></label>
        </div>
      </div>

      <!-- Difficulty -->
      <div class="section">
        <div class="label">Difficulty</div>
        <div class="grid">
          <label><input type="radio" name="difficulty" value="beginner" required><div class="opt">Beginner</div></label>
          <label><input type="radio" name="difficulty" value="intermediate"><div class="opt">Intermediate</div></label>
          <label><input type="radio" name="difficulty" value="advanced"><div class="opt">Advanced</div></label>
        </div>
      </div>

      <button class="btn">⚡ Generate Question Paper</button>

    </form>

  </div>
</div>

<script>
const fileInput = document.getElementById("fileInput");
const chip = document.getElementById("fileChip");
const box = document.getElementById("uploadBox");

fileInput.addEventListener("change", () => {
  chip.innerHTML = `<span class="file-chip">${fileInput.files[0].name}</span>`;
});

/* Drag & drop */
box.addEventListener("dragover", e => {
  e.preventDefault();
  box.style.background = "rgba(56,189,248,0.12)";
});

box.addEventListener("dragleave", () => {
  box.style.background = "rgba(255,255,255,0.03)";
});

box.addEventListener("drop", e => {
  e.preventDefault();
  fileInput.files = e.dataTransfer.files;
  chip.innerHTML = `<span class="file-chip">${e.dataTransfer.files[0].name}</span>`;
});
</script>

</body>
</html>
